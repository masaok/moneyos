name: Setup
description: >
  Shared toolchain setup for every job. Node comes from .nvmrc, pnpm from the
  "packageManager" field in package.json, and the install refuses to change the
  lockfile. Change versions in those files, never here.

runs:
  using: composite
  steps:
    - name: pnpm (version from package.json "packageManager")
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Node (version from .nvmrc)
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install (frozen lockfile)
      shell: bash
      run: pnpm install --frozen-lockfile
